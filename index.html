<html lang="de">
<head>

<title>Cube Dash</title>
<style>

[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;font-family:system-ui,sans-serif}
#c{display:block;width:100%;height:100%}
#menu,#skins,#rank,#ed,#set{position:fixed;inset:0;overflow-y:auto;background:linear-gradient(#2a1d7a,#6b2a8f);color:var(--fg);padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));text-align:center}

#list button,#sl button,#skb,#sb,#daily,#sall{text-align:left;background:var(--card);color:var(--fg);border:2px solid var(--acc);border-radius:12px;padding:14px 16px;font:inherit;display:grid;gap:4px;cursor:pointer}
#list span{opacity:.8;font-size:14px}

#back,#mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;background:var(--card);color:var(--fg);border:2px solid var(--acc);border-radius:10px;padding:6px 12px;font:inherit;cursor:pointer}

.btn{background:var(--card);color:var(--fg);border:2px solid var(--acc);border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer}

#edw{overflow-x:auto;max-width:100%;margin:10px auto;border:2px solid var(--acc)}
#ec{display:block}
#tb select{font:inherit;padding:8px;border-radius:10px}

#title .sp{width:.35em}

#play:hover,#play:focus-visible{filter:brightness(1.15)}
#tap{font-size:15px;letter-spacing:.2em;text-transform:uppercase;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
#sst{font-size:13px;opacity:.85;background:rgba(0,0,0,.3);padding:6px 14px;border-radius:20px}
#fl{position:absolute;inset:0;pointer-events:none}
#fl i{position:absolute;bottom:-60px;opacity:.8;animation:fy linear infinite}

@media (prefers-reduced-motion:reduce){#start *,#playw::before,#playw::after{animation:none!important}}
#menu{background:rgba(20,10,70,.25)}
#car{display:flex;align-items:center;justify-content:center;gap:10px;max-width:520px;margin:14px auto}
#lc{flex:1;min-width:0;background:rgba(20,10,70,.78);border:2px solid var(--acc);border-radius:16px;padding:14px;min-height:190px;touch-action:pan-y;text-align:left}
#lc h2{margin:0 0 8px;color:var(--acc);font-size:22px}
#lc p{margin:4px 0;font-size:14px}
#lc canvas{max-width:100%;margin-top:8px}
.tri,#lgo{border:0;padding:0;background:linear-gradient(135deg,#fff6b0,#ffd23f 50%,#ff8a2b);cursor:pointer;flex:none}
.tri{width:44px;height:64px}
#prv{clip-path:polygon(100% 0,0 50%,100% 100%)}
#nxt{clip-path:polygon(0 0,100% 50%,0 100%)}
#lgo{width:70px;height:80px;clip-path:polygon(0 0,100% 50%,0 100%)}

#lgow{display:flex;justify-content:center;margin:10px 0 20px;filter:drop-shadow(0 0 14px rgba(255,210,63,.7))}
#pg{margin:0}
#daily{display:block;margin:8px auto}
</style>
</head>

      if(o.d){x.moveTo(o.x,o.y);x.lineTo(o.x+o.w,o.y);x.lineTo(o.x+o.w/2,o.y+o.h)}
      else{x.moveTo(o.x,o.y+o.h);x.lineTo(o.x+o.w/2,o.y);x.lineTo(o.x+o.w,o.y+o.h)}
      x.closePath();x.fill();x.stroke();
    }
  }
  if(st==='menu'){if(!startEl.hidden)drawDemo();return}
  if(OP.att&&st!=='ready'){const ax=PX+150-dist;if(ax>-320){x.save();x.globalAlpha=Math.max(0,Math.min(1,(ax+260)/260));x.fillStyle='#fff';x.font='700 38px system-ui,sans-serif';x.textAlign='left';x.fillText('Versuch '+curA,ax,110);x.restore()}}drawT();drawP();if(OP.hit)drawHit();
  const pc=Math.min(100,Math.floor(dist/lv.len*10000)/100);
  if(OP.bar){x.fillStyle='rgba(255,255,255,.3)';x.fillRect(W/2-100,10,200,6);x.fillStyle='#ffd23f';x.fillRect(W/2-100,10,2*pc,6)}
  if(OP.pct)txt(pc.toFixed(2)+' %',34,16);if(practice){txt('Übungsmodus · Checkpoints: '+cps.length,58,13);for(const c of cps){const mx=PX+(c.dist-dist);if(mx>-20&&mx<W+20){x.fillStyle='#7dff6b';x.beginPath();x.moveTo(mx,G-14);x.lineTo(mx+9,G-4);x.lineTo(mx,G+6);x.lineTo(mx-9,G-4);x.closePath();x.fill()}}}if(OP.coins)for(let i=0;i<3;i++){x.fillStyle=cr[i]?'#ffc21a':'rgba(255,255,255,.3)';x.beginPath();x.arc(24+i*22,26,7,0,7);x.fill()}
  if(OP.fps){x.fillStyle='#fff';x.font='12px system-ui,sans-serif';x.textAlign='left';x.fillText(fpsV+' FPS',8,356)}
  if(st==='ready'){if(OP.att)txt('Versuch '+curA,96,18);txt(lv.n,130,34);txt('★'.repeat(lv.s)+'☆'.repeat(5-lv.s)+'  '+lv.dn,155,16);if(OP.hint)txt('Tippen zum Starten. Halten oder tippen steuert jeden Modus.',175,14)}
  if(st==='dead'){if(OP.att)txt('Versuch '+curA,92,16);txt('Game Over',130,38);txt(pc.toFixed(2)+' %   Rekord: '+(B[li]||0).toFixed(2)+' %',165,18);if(OP.hint)txt('Tippen für einen neuen Versuch',200,15);if(lastGain)txt('Neuer Rekord! +'+lastGain+' Gems',228,16)}
  if(st==='win'){if(OP.winfx)drawWin();else{txt('Level geschafft!',160,34);if(OP.hint&&performance.now()-dieT>800)txt('Tippen für das Menü',200,15)}}
}
function press(e){
  if(e&&e.target&&e.target.closest&&e.target.closest('button,#menu'))return;
  if(st==='menu')return;
  if(st==='win'){if(performance.now()-dieT>(OP.winfx?1500:400))toMenu();return}
  if(st==='ready'||st==='dead'){
    if(st==='dead'&&performance.now()-dieT<300)return;
    if(practice&&cp&&st==='dead')loadCP();else{reset();cp=null;cpAt=0;cps=[];attempt()}st='play';held=true;tapQ=true;return;
  }
  held=true;tapQ=true;
}
addEventListener('pointerdown',press);
addEventListener('pointerup',()=>{held=false});
addEventListener('keydown',e=>{
  if(!$('start').hidden&&(e.code==='Enter'||e.code==='Space')){e.preventDefault();$('play').click();return}
  if(st==='menu'&&!$('menu').hidden&&(e.code==='ArrowRight'||e.code==='ArrowLeft')){go(e.code==='ArrowRight'?1:-1);return}
  if(e.code==='KeyC'){setCP();return}
  if(e.code==='KeyX'){delCP();return}
  if(e.code==='Escape'){toMenu();return}
  if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)press()}
});
addEventListener('keyup',()=>{held=false});
let last=performance.now(),acc=0,lD=0,fpsV=0,fpsN=0,fpsT=0;
function loop(t){
  acc+=Math.min(100,t-last);last=t;fpsN++;if(t-fpsT>=500){fpsV=Math.round(fpsN*1000/(t-fpsT));fpsN=0;fpsT=t}
  while(acc>=1000/60){if(st==='play'){step();if(st==='play'){tick();chkCP()}}else if(st==='menu'){dist+=4;if(!startEl.hidden)demoStep()}else if(st==='win')updWin();acc-=1000/60}
  if(OP.auto&&st==='dead'&&performance.now()-dieT>700){press();held=false;tapQ=false}
  if(st==='menu'&&t-lD>500){lD=t;updDaily()}draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
